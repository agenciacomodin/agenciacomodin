name: Build FRIENDS Selfcontained

on:
  push:
    paths:
      - 'friends/SELFCONTAIN_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline FRIENDS logo and harden navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,re
          html_path=Path('friends/preview.html')
          logo_path=Path('friends/logo.png')
          s=html_path.read_text(encoding='utf-8')
          logo='data:image/png;base64,'+base64.b64encode(logo_path.read_bytes()).decode()
          s=re.sub(r'(<img[^>]*class="brand"[^>]*src=")[^"]+("[^>]*>)',lambda m:m.group(1)+logo+m.group(2),s,count=1)
          # Remove any stale service-worker code if present.
          s=re.sub(r'<script[^>]*>[^<]*serviceWorker[\s\S]*?</script>','',s,flags=re.I)
          # Ensure stable navigation exists exactly once.
          s=re.sub(r'<script id="friends-clean-navigation">[\s\S]*?</script>','',s)
          nav=r'''<script id="friends-clean-navigation">
(function(){
  function sync(id){document.querySelectorAll('[data-view]').forEach(function(b){var on=b.getAttribute('data-view')===id;b.classList.toggle('on',on);if(b.closest('.nav'))b.classList.toggle('active',on);});}
  function go(id){var to=document.getElementById(id);if(!to)return;var from=document.querySelector('.view.active');var wash=document.querySelector('.motion-wash');if(from===to){sync(id);return;}if(from)from.classList.add('leaving');if(wash)wash.classList.add('show');sync(id);setTimeout(function(){if(from)from.classList.remove('active','leaving');to.classList.add('active');to.style.animation='none';void to.offsetHeight;to.style.animation='';window.scrollTo(0,0);},150);setTimeout(function(){if(wash)wash.classList.remove('show');},340);}
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-view]');if(!b)return;e.preventDefault();go(b.getAttribute('data-view'));});
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id==='inicio');});sync('inicio');window.__FRIENDS_SELFCONTAINED__=true;
})();
</script>'''
          s=s.replace('</body>',nav+'\n</body>',1)
          Path('friends/final-selfcontained.html').write_text(s,encoding='utf-8')
          PY
      - name: Commit final self-contained preview
        shell: bash
        run: |
          git config user.name "FRIENDS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add friends/final-selfcontained.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build self-contained FRIENDS preview"
            git push
          fi

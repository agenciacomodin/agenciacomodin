name: Build FRIENDS Direct HTML

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/friends-pages.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified FRIENDS preview
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/friends.gz.b64 <<'EOF'
[...truncated for brevity in this record...]EOF
          base64 -d /tmp/friends.gz.b64 | gunzip > friends/direct.html
          grep -q 'Conectá' friends/direct.html
          grep -q 'Explorar' friends/direct.html
          grep -q 'data-view="reservas"' friends/direct.html
          grep -q 'data-view="saldo"' friends/direct.html
          grep -q 'data-view="admin"' friends/direct.html
          grep -q '__FRIENDS_PREVIEW_OK__' friends/direct.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add friends/direct.html
          git commit -m 'Publish verified FRIENDS preview' || exit 0
          git push

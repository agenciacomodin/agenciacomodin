<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FRIENDS</title><style>html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#fff;color:#101828}.load{height:100%;display:grid;place-items:center;text-align:center}.dot{width:38px;height:38px;border:4px solid #eee;border-top-color:#6D3BFF;border-radius:50%;animation:s .8s linear infinite;margin:auto auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div><div class="dot"></div><b>FRIENDS</b><div style="margin-top:8px;color:#667085;font-size:14px">Cargando plataforma...</div></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/agenciacomodin/agenciacomodin/main/friends/parts/';let b='';for(let i=0;i<5;i++){const r=await fetch(base+'p0'+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('parte '+i);b+=await r.text()}const bin=atob(b.replace(/\s/g,''));const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(u8);if(!html.includes('Conectá')||!html.includes('Explorar'))throw new Error('contenido incompleto');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:32px;font-family:system-ui"><h1>FRIENDS</h1><p>Error de carga. Recargá la página.</p><small>'+String(e)+'</small></div>'}})();</script></body></html>

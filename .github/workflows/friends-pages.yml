name: Build FRIENDS Direct HTML

on:
  push:
    paths:
      - '.github/workflows/friends-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild direct FRIENDS HTML
        shell: bash
        run: |
          set -euo pipefail
          cat friends/parts/p00.txt friends/parts/p01.txt friends/parts/p02.txt friends/parts/p03.txt friends/parts/p04.txt > /tmp/friends.b64
          base64 -d /tmp/friends.b64 > friends/direct.html
          grep -q 'Conectá' friends/direct.html
          grep -q 'Explorar' friends/direct.html
          grep -q 'data-view="reservas"' friends/direct.html
          grep -q 'data-view="saldo"' friends/direct.html
          grep -q 'data-view="admin"' friends/direct.html
          grep -q 'data:image/png;base64' friends/direct.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add friends/direct.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish direct FRIENDS HTML'
          git push

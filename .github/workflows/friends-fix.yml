name: Fix FRIENDS Public Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'friends/PATCH_NOW'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair FRIENDS public HTML
        run: python friends/fix.py
      - name: Commit repaired public files
        run: |
          git config user.name "FRIENDS Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add friends/direct.html friends/logo.*
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Repair FRIENDS public preview"
            git push
          fi
